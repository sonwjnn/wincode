# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  jobs:
    - name: biome-fix
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx ultracite fix {staged_files}
      stage_fixed: true

    - name: biome-check
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx ultracite check {staged_files}
