name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  AZURE_OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  COHERE_API_KEY: ""
  DATABASE_URL: ""
  GITHUB_TOKEN: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GOOGLE_API_KEY: ""
  GOOGLE_GENERATIVE_AI_API_KEY: ""
  GROQ_API_KEY: ""
  MISTRAL_API_KEY: ""
  OPENAI_API_KEY: ""
  OPENCODE_API_KEY: ""
  OPENCODE_GO_API_KEY: ""
  OPENROUTER_API_KEY: ""
  XAI_API_KEY: ""

jobs:
  check-types:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check-types

  default:
    name: Default tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  session-writer-lock:
    name: Session Writer lock (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - name: macOS ARM64
            runner: macos-15
            platform: darwin
            arch: arm64
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build runtime dependency for direct lock tests
        run: bun run build:utils
      - name: Verify native runner target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          bun -e 'if (process.platform !== process.env.EXPECTED_PLATFORM ||
          process.arch !== process.env.EXPECTED_ARCH) {
          throw new Error("Expected " + process.env.EXPECTED_PLATFORM + "/" +
          process.env.EXPECTED_ARCH + ", got " + process.platform + "/" +
          process.arch);
          }'
      - name: Prepare isolated test-entrypoint fixture
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'wincode test entrypoint fixture'
          $testDirectory = Join-Path $fixtureRoot 'packages/probe/test'
          New-Item -ItemType Directory -Path $testDirectory -Force | Out-Null
          $testSource = @'
          import * as fs from "node:fs";
          import * as path from "node:path";
          import { expect, test } from "bun:test";

          test("Windows launchers isolate user data and provider credentials", () => {
            expect(process.env.OPENAI_API_KEY ?? "").toBe("");
            expect(process.env.HOME).toBe(process.env.USERPROFILE);
            const directoryNames = [
              "HOME",
              "USERPROFILE",
              "XDG_CONFIG_HOME",
              "XDG_DATA_HOME",
              "XDG_CACHE_HOME",
              "APPDATA",
              "LOCALAPPDATA",
              "TEMP",
              "TMP",
              "TMPDIR",
              "WINCODE_TEST_SESSION_INDEX_DIR",
            ];
            const directories = directoryNames.map((name) => process.env[name]);
            for (const directory of directories) {
              expect(directory).toBeDefined();
              expect(path.isAbsolute(directory ?? "")).toBe(true);
            }
            fs.writeFileSync(
              path.resolve(import.meta.dir, "../../../test-entrypoint-paths.json"),
              JSON.stringify(directories)
            );
          });
          '@
          Set-Content -LiteralPath (Join-Path $testDirectory 'entrypoint.test.ts') -Value $testSource -Encoding utf8
      - name: Smoke PowerShell test entrypoint
        if: matrix.platform == 'win32'
        env:
          OPENAI_API_KEY: wrapper-smoke-secret
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'wincode test entrypoint fixture'
          & .\test.ps1 --root $fixtureRoot --package probe
      - name: Verify PowerShell entrypoint cleanup
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'wincode test entrypoint fixture'
          $marker = Join-Path $fixtureRoot 'test-entrypoint-paths.json'
          $directories = @(Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json)
          $remaining = @($directories | Where-Object { Test-Path -LiteralPath $_ })
          if ($remaining.Count -gt 0) { throw "PowerShell test wrapper left temporary user data behind." }
      - name: Smoke batch test entrypoint
        if: matrix.platform == 'win32'
        env:
          OPENAI_API_KEY: wrapper-smoke-secret
        shell: cmd
        run: test.bat --root "%RUNNER_TEMP%\wincode test entrypoint fixture" --package probe
      - name: Verify batch entrypoint cleanup
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'wincode test entrypoint fixture'
          $marker = Join-Path $fixtureRoot 'test-entrypoint-paths.json'
          $directories = @(Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json)
          $remaining = @($directories | Where-Object { Test-Path -LiteralPath $_ })
          if ($remaining.Count -gt 0) { throw "Batch test wrapper left temporary user data behind." }
      - name: Windows headless interactive startup contracts (not ConPTY)
        if: matrix.platform == 'win32'
        run: bun test packages/coding-agent/test/application/cli-startup.test.ts --timeout=30000
      - run: bun test packages/coding-agent/test/sessions/session-writer-lock-target.test.ts
      - name: Run native lock smoke and process contract
        shell: bash
        run: >-
          bun test packages/coding-agent/test/sessions/session-writer-lock.test.ts
          --timeout=15000
          --test-name-pattern
          'allows different Session IDs in one workspace to hold writers concurrently|allows separate processes to own different Session IDs in one database|refuses another process for the same Session ID while its writer is live|releases a Session Writer when its process exits'

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: test-artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

  interactive-smoke:
    name: Faux TUI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:utils
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - run: bun run test:tui
      - name: Upload faux smoke frames and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-smoke-${{ matrix.os }}
          path: test-artifacts/interactive-smoke
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Required test gate
    if: always()
    needs: [check-types, default, e2e, session-writer-lock, interactive-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require type checking, Default, E2E, and Session Writer locks
        run: |
          test "${{ needs.check-types.result }}" = success
          test "${{ needs.default.result }}" = success
          test "${{ needs.e2e.result }}" = success
          test "${{ needs.session-writer-lock.result }}" = success
          test "${{ needs.interactive-smoke.result }}" = success
