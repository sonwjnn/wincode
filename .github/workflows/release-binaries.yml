name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft-release:
    name: Create draft GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the tag to match the Coding-Agent version
        shell: bash
        run: |
          expected_tag="v$(jq -r '.version' packages/coding-agent/package.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf 'Tag %s does not match package version %s.\n' "$GITHUB_REF_NAME" "$expected_tag" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wincode-*
          path: release-assets
          merge-multiple: true
      - name: Validate all release assets and checksums
        shell: bash
        run: |
          archives=(
            wincode-linux-x64.tar.gz
            wincode-linux-arm64.tar.gz
            wincode-macos-x64.tar.gz
            wincode-macos-arm64.tar.gz
            wincode-windows-x64.zip
          )
          for archive in "${archives[@]}"; do
            checksum="release-assets/$archive.sha256"
            if [[ ! -s "release-assets/$archive" || ! -s "$checksum" ]]; then
              printf 'Missing release asset or checksum: %s\n' "$archive" >&2
              exit 1
            fi
            (cd release-assets && sha256sum -c "$(basename "$checksum")")
          done
      - name: Create or update the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != 'true' ]]; then
              printf 'Release %s already exists and is published; refusing to replace its assets.\n' "$tag" >&2
              exit 1
            fi
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* --draft --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
